# Shared settings for every tutorial in this folder.
engine: knitr
format:
  html:
    toc: true
    toc-depth: 2
    toc-location: left
    code-copy: true
    code-overflow: wrap
execute:
  warning: false
  message: false
# Share buttons (Email, X, WhatsApp, LinkedIn, Copy link) under the title and at the end
include-after-body:
  text: '<script src="/assets/js/share.js"></script>'
