# Shared settings for every tutorial in this folder.
engine: knitr
format:
  html:
    toc: true
    toc-depth: 2
    toc-location: left
    code-copy: true
    code-overflow: wrap
execute:
  warning: false
  message: false
# Share buttons under the title and at the end (share.js), and the "In this series"
# side panel for multi-part tutorials (series-panel.js)
include-after-body:
  text: '<script src="/assets/js/share.js"></script><script src="/assets/js/series-panel.js"></script>'
# Link-preview image (LinkedIn, X, WhatsApp) for the Data science track; the
# command-line track sets its own in tutorials/command-line/_metadata.yml
image: images/tutorial-series.jpg
