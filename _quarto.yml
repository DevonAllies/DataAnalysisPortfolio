project:
  type: website
  output-dir: docs
  resources:
    - CNAME   # custom domain for GitHub Pages; must be copied into docs/
    - "tutorials/data/*.xlsx"
    - "tutorials/data/*.csv"

website:
  title: "Devon Allies"
  description: "Bioinformatician and computational biologist: data portfolio, tutorials and publications."
  # Search and sharing: site-url makes Quarto write docs/sitemap.xml;
  # open-graph adds link-preview tags to every page.
  site-url: "https://devonallies.co.za/"
  image: assets/images/me.jpeg
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: tutorials.qmd
        text: Tutorials
      - href: publications.qmd
        text: Publications & Writing
      - href: about.qmd
        text: About Me
      
format:
  html:
    # Light and dark themes: Quarto adds a toggle to the navbar and remembers
    # each visitor's choice; respect-user-color-scheme starts from their
    # system setting.
    theme:
      light:
        - cosmo
        - brand
        - assets/css/theme.scss
      dark:
        - cosmo
        - brand
        - assets/css/theme.scss
        - assets/css/theme-dark.scss
    respect-user-color-scheme: true
    css: assets/css/styles.css
    toc: true
    grid:
      body-width: 960px   # Quarto default is 800px

filters:
  - acronyms
  
acronyms:
  fromfile: ./acronyms.yml
  loa_title: "List of Acronyms"
  insert_loa: false
  insert_links: true
  include_unused: true
  sorting: alphabetical
  style: "long-short"