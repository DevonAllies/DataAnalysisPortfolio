# Shared settings for every article in this folder.
# Links to other websites open in a new tab, so readers keep the article open.
# Links within this site still open in the same tab.
link-external-newwindow: true
# Share buttons (Email, X, WhatsApp, LinkedIn, Copy link) under the title and at the end
include-after-body:
  text: '<script src="/assets/js/share.js"></script>'
